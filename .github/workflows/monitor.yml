name: Cloud ICT Sentinel (Plan E)

# ============================================================================
# 云端方案 E / ICT 哨兵
#
#   · 每小时第 5、35 分钟各跑一次（cron 是 UTC；北京 = UTC+8，整点偏移，
#     所以 :05 / :35 在北京时间也正好是 :05 / :35）
#   · 无状态：不写任何文件、不提交仓库，跑完即走
#   · 去重靠脚本里的「信号根收盘 ≤30 分钟」时效窗口：
#       :05 那次命中（K 线刚收 5 分钟）→ 推送
#       :35 那次同一根已 35 分钟 → 自动跳过，不会重复推
#   · 手动跑：Actions → 本工作流 → Run workflow，可勾 force / test
# ============================================================================

on:
  schedule:
    - cron: "5,35 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "跳过时效窗口（调试用）填 true"
        required: false
        default: "false"
      test:
        description: "只发一条连通性测试推送给 true"
        required: false
        default: "false"

concurrency:
  group: cloud-ict-sentinel
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 脚本只用标准库（urllib），不需要 pip install
      - name: 运行云端哨兵
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          FORCE: ${{ github.event.inputs.force == 'true' && '1' || '' }}
          TEST: ${{ github.event.inputs.test == 'true' && '1' || '' }}
        run: python cloud_ict_e.py
